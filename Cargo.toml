[package]
name = "mitosis-db"
version = "1.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Copy-on-write Postgres clones for AI agent tasks on macOS (APFS) and Linux (Btrfs, XFS, ZFS)"
repository = "https://github.com/irfanfaraaz/mitosis"
homepage = "https://github.com/irfanfaraaz/mitosis"
readme = "README.md"
keywords = ["postgres", "database", "clone", "copy-on-write", "mcp"]
categories = ["command-line-utilities", "database", "development-tools"]
rust-version = "1.89"
exclude = [".github/", "docs/", "assets/"]

[lib]
name = "mitosis"
path = "src/lib.rs"

[[bin]]
name = "mitosis"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rmcp = { version = "3.5", features = ["server", "client", "macros", "transport-io", "transport-child-process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.31", features = ["signal", "process", "event", "fs", "term"] }
libc = "0.2"
toml = "1.1.8"
# `mitosis pg install` only (the one place Mitosis downloads): rustls keeps it free of OpenSSL; no transparent gzip so the SHA-256 covers the bytes on the wire.
ureq = { version = "3.4.2", default-features = false, features = ["rustls"] }
sha2 = "0.11.1"
flate2 = "1.1.10"
tar = { version = "0.4.46", default-features = false }

[dev-dependencies]
tempfile = "3"
