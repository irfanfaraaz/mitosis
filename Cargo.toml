[package]
name = "mitosis-db"
version = "0.2.0"
edition = "2021"
license = "MIT OR Apache-2.0"
description = "Copy-on-write Postgres clones for AI agent tasks on macOS APFS"
repository = "https://github.com/irfanfaraaz/mitosis"
homepage = "https://github.com/irfanfaraaz/mitosis"
readme = "README.md"
keywords = ["postgres", "database", "clone", "copy-on-write", "mcp"]
categories = ["command-line-utilities", "database", "development-tools"]
rust-version = "1.89"
exclude = [".github/", "docs/"]

[lib]
name = "mitosis"
path = "src/lib.rs"

[[bin]]
name = "mitosis"
path = "src/main.rs"

[dependencies]
tokio = { version = "1", features = ["full"] }
clap = { version = "4", features = ["derive"] }
rusqlite = { version = "0.40", features = ["bundled"] }
rmcp = { version = "3.5", features = ["server", "client", "macros", "transport-io", "transport-child-process"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
nix = { version = "0.31", features = ["signal", "process", "event", "fs", "term"] }
libc = "0.2"
toml = "1.1.8"

[dev-dependencies]
tempfile = "3"
