name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - name: Install Postgres
        run: brew install postgresql@18
      - run: cargo fmt --check
      - run: cargo clippy --all-targets -- -D warnings
      # Opt-in managed build: a second major for the cross-major upgrade tests. The runner target may
      # lack a build, so a failure only warns; the tests find it through PATH and skip without it.
      - name: Install Postgres 17 (mitosis pg install)
        run: |
          if out=$(cargo run --quiet -- pg install 17); then
            bin=$(printf '%s\n' "$out" | tail -n 1)
          else
            bin=""
          fi
          if [ -d "$bin" ]; then
            echo "$bin" >> "$GITHUB_PATH"
          else
            echo "::warning::no managed Postgres 17 for this runner; the cross-major tests will skip"
          fi
      - run: cargo test
